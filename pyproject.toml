[project]
name = "analog-rain-gauge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydoover>=1.4.2",
    "transitions>=0.9.2",
]

[project.scripts]
export-config = "analog_rain_gauge.app_config:export"
export-ui = "analog_rain_gauge.app_ui:export"
doover-app-run = "analog_rain_gauge:main"
export-config-dashboard = "analog_rain_gauge_dashboard.app_config:export"
export-ui-dashboard = "analog_rain_gauge_dashboard.app_ui:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analog_rain_gauge", "src/analog_rain_gauge_dashboard"]

[dependency-groups]
dev = [
    "aiohttp>=3.11.18",
    "grpcio>=1.71.0",
    "protobuf>=6.30.2",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "requests>=2.32.3",
]

[tool.uv.sources]
