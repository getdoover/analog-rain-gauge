    environment:
      - APP_KEY=test_app_key
      - CONFIG_FP=/app/simulators/app_config.json
      - HEALTHCHECK_PORT=49202
#      - DDA_URI=192.168.0.53:50051
    volumes:
      - /etc/localtime:/etc/localtime:ro

  pulse_output:
    build: pulse_output/
    network_mode: host
    restart: unless-stopped
    environment:
      - APP_KEY=pulse_output
      - HEALTHCHECK_PORT=49212
      # Timing overrides (defaults shown). Pins are fixed: DO 0 -> 0, DO 1 -> 1.
      # - DO0_INTERVAL_SECS=864000        # 10 days
      # - DO1_MIN_INTERVAL_SECS=1         # 1 second
      # - DO1_MAX_INTERVAL_SECS=3600      # 1 hour
      # - PULSE_HIGH_SECS=1.0
      # - REPORT_INTERVAL_SECS=15
      # - LOOP_PERIOD_SECS=1.0
      # - LOG_CHANNEL=pulse_output_log    # channel each DO set is recorded to
      # Point at the device agent if not auto-discovered on the doovit:
      # - DDA_URI=127.0.0.1:50051
    volumes:
      - /etc/localtime:/etc/localtime:ro
